.nv-stats{display:flex;gap:12px;margin:0 0 11px;padding:9px 0}
.nv-stats>div{display:flex;flex-direction:column;gap:2px}
.nv-stats strong{font-size:17px;font-weight:600;line-height:1.15}

.nv-zones{margin:0}

.nv-zones button{display:flex;align-items:center;gap:8px;width:100%;padding:4px 0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}

const tint = (hex, amount) => `#${new THREE.Color(hex).lerp(new THREE.Color(amount > 0 ? '#ffffff' : '#000000'), Math.abs(amount)).getHexString()}`;
// A soft radial backdrop reads as studio light instead of a flat fill.
const backdrop = (hex) => `radial-gradient(125% 115% at 50% 6%, ${tint(hex, 0.2)} 0%, ${tint(hex, 0.06)} 44%, ${tint(hex, -0.14)} 100%)`;

// The five archive models ship no people, so the gallery shares one character
// between them: the 草坪分享会 visitor is downloaded once and cloned onto each
// scene's own spots, so every scene answers the same 人物 control. The donor is
// 1.40 m as authored, scaled to real-scale 1.67 m so it fits the other scenes.
const DONOR = { src: './lawn/lawn.glb', group: 'Lawn_People', scale: 1.19 };
let donorCast = null;
const loadDonorCast = () => {
  donorCast ??= new GLTFLoader().loadAsync(new URL(DONOR.src, import.meta.url).href).then((gltf) => {
    const group = gltf.scene.getObjectByName(DONOR.group);
    if (!group || !group.children.length) throw new Error(`角色来源 ${DONOR.group} 不可用`);
    return group.children;
  });
  return donorCast;
};

const element = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
};

const gallery = document.getElementById('gallery');
for (const scene of SCENES) {
  const block = element('section', 'scene-block');
  const native = element('div', 'scene-native');

  const panel = element('aside', 'nv-panel');
  panel.append(
    element('p', 'nv-eyebrow', scene.eyebrow),
    element('h2', 'nv-title', scene.title),
    element('p', 'nv-sub', scene.sub),
    element('p', 'nv-intro', scene.intro),
  );
  const stats = element('div', 'nv-stats');
  for (const [value, unit, label] of scene.stats) {
    const strong = element('strong', null, value);
    if (unit) strong.appendChild(element('small', null, unit));
    const cell = element('div');
    cell.append(strong, element('span', null, label));
    stats.appendChild(cell);
  }
  panel.appendChild(stats);
  const zones = element('div', 'nv-zones');
  zones.append(element('h2', null, '分区'), element('div', 'nv-zones-list'));
  panel.appendChild(zones);

  // 时段 + 人物 live in the sidebar as one collapsible block, not as a band
  // under the stage.
  const time = element('section', 'nv-time');
  const timeHead = element('button', 'nv-time-head');
  timeHead.type = 'button';
  timeHead.setAttribute('aria-expanded', 'true');
  const timeCurrent = element('span', 'nv-time-current');
  const timeCaret = element('em', 'nv-time-caret', '⌃');
  timeHead.append(element('span', 'tl-kicker', '时段'), timeCurrent, timeCaret);
  const timeBody = element('div', 'nv-time-body');
  const steps = element('div', 'tl-steps');
  const peopleGroup = element('div', 'tl-people');
  peopleGroup.appendChild(element('span', 'tl-kicker', '人物'));
  const range = element('input');
  const output = element('output');
  // Every scene carries the same live 人物 control: a real headcount when the
  // GLB ships people, otherwise the shared visitor character this viewer borrows.
  const live = scene.guests || scene.people;
  range.type = 'range';
  range.id = `people-${scene.id}`;
  range.min = String(live.min);
  range.max = String(live.max);
  range.step = '1';
  range.value = String(live.value);
  range.setAttribute('aria-label', '人物数量');
  output.value = String(live.value);
  output.setAttribute('for', range.id);
  peopleGroup.append(output, range);
  if (live.note) peopleGroup.appendChild(element('span', 'tl-note', live.note));
  timeBody.append(steps, peopleGroup);
  time.append(timeHead, timeBody);
  panel.appendChild(time);
  scene.guestRange = range;
  scene.guestOutput = output;
  scene.time = time;
  scene.timeCurrent = timeCurrent;
  timeHead.addEventListener('click', () => {
    const collapsed = time.classList.toggle('collapsed');
    timeHead.setAttribute('aria-expanded', String(!collapsed));
  });

  const stage = element('div', 'nv-stage');
  const canvas = element('canvas');
  canvas.setAttribute('aria-label', `${scene.title} 三维场景，可拖动旋转、滚轮缩放`);
  const labels = element('div', 'nv-labels');
  labels.setAttribute('aria-hidden', 'true');
  const switches = element('div', 'nv-switches');
  const addSwitch = (role, text, checked) => {
    const wrap = element('label');
    const input = element('input');
    input.type = 'checkbox';
    input.checked = checked;
    input.dataset.role = role;
    wrap.append(input, document.createTextNode(` ${text}`));
    switches.appendChild(wrap);
    return input;
  };
  const labelToggle = addSwitch('labels', '分区', true);
  const roofToggle = scene.enclosure ? addSwitch('enclosure', scene.enclosureLabel || '屋顶', scene.enclosureDefault === true) : null;
  const lightToggle = scene.lights ? addSwitch('lights', scene.lightsLabel || '灯光', scene.lightsDefault === true) : null;
  const selection = element('div', 'nv-selection');
  selection.hidden = true;
  const close = element('button', 'nv-selection-close', '×');
  close.type = 'button';
  close.setAttribute('aria-label', '关闭分区说明');
  const selectionNo = element('small');
  const selectionTitle = element('h3');
  const selectionCopy = element('p');
  selection.append(close, selectionNo, selectionTitle, selectionCopy);
  const views = element('div', 'nv-views');
  for (const [key, text] of VIEWS) {
    const button = element('button', null, text);
    button.type = 'button';
    button.dataset.view = key;
    button.setAttribute('aria-pressed', String(key === 'overview'));
    views.appendChild(button);
  }
  views.appendChild(element('i'));
  const reset = element('button', null, '↺');
  reset.type = 'button';
  reset.dataset.reset = 'true';
  reset.setAttribute('aria-label', '复位视角');
  views.appendChild(reset);
  stage.append(canvas, labels, switches, selection, views, element('p', 'nv-status', '读取模型…'));

  native.append(panel, stage);
  block.append(native);
  gallery.appendChild(block);

  Object.assign(scene, {
    block, panel, stage, canvas, labelLayer: labels, selection,
    selectionNo, selectionTitle, selectionCopy,
    listEl: panel.querySelector('.nv-zones-list'),
    statusEl: stage.querySelector('.nv-status'),
    labelToggle, roofToggle, lightToggle,
    viewButtons: Array.from(views.querySelectorAll('[data-view]')),
    steps: Array.from(steps.querySelectorAll(':scope > *')),
    stepList: steps,
  });
}

const createViewer = async (scene) => {
  const { canvas, stage } = scene;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.shadowMap.autoUpdate = false;

  const world = new THREE.Scene();
  // The backdrop is a CSS gradient behind a transparent canvas, so each scene
  // gets a soft sky instead of one flat colour.
  renderer.setClearAlpha(0);
  const hemi = new THREE.HemisphereLight('#e5f0ff', '#7b8b6e', 2);
  world.add(hemi);
  const perspective = new THREE.PerspectiveCamera(43, 1, 0.12, 900);
  const orthographic = new THREE.OrthographicCamera(-35, 35, 35, -35, 0.1, 900);
  let camera = perspective;
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.09;
  controls.screenSpacePanning = false;
  controls.minPolarAngle = 0.001;
  controls.maxPolarAngle = Math.PI / 2 - 0.025;
  controls.minDistance = 0.6;
  controls.maxDistance = 600;

  const sun = new THREE.DirectionalLight('#fff1d8', 2.6);
  sun.position.set(-24, 40, 18);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 0.5, far: 160 });
  sun.shadow.normalBias = 0.035;
  sun.shadow.bias = -0.0002;
  world.add(sun, sun.target);
  const fill = new THREE.DirectionalLight('#dbe7ff', 1);
  fill.position.set(18, 22, -26);
  world.add(fill);

  const pmrem = new THREE.PMREMGenerator(renderer);
  const room = new RoomEnvironment();
  const environment = pmrem.fromScene(room, 0.08);
  world.environment = environment.texture;
  world.environmentIntensity = 0.46;
  room.dispose();
  pmrem.dispose();

  const box = new THREE.Box3();
  const marker = new THREE.Vector3();
  let raf = null;
  let view = 'overview';
  let labelsOn = true;
  let active = null;
  let tween = null;
  let peopleGroup = null;
  let figureGroup = null;
  let enclosure = null;
  const size = new THREE.Vector2(1, 1);
  const placed = [];

  const updateLabels = () => {
    for (const item of placed) {
      const point = marker.copy(item.point).project(camera);
      const x = (point.x * 0.5 + 0.5) * size.x;
      const y = (-point.y * 0.5 + 0.5) * size.y;
      const inside = point.z < 1 && Math.abs(point.x) < 1.15 && Math.abs(point.y) < 1.15;
      item.el.style.opacity = labelsOn && view !== 'inside' && inside ? '1' : '0';
      item.el.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px)`;
    }
  };
  const render = () => {
    raf = null;
    const animating = stepTween();
    const moving = controls.update();
    renderer.render(world, camera);
    updateLabels();
    if (moving || animating) invalidate();
  };
  const invalidate = () => {
    if (raf === null) raf = requestAnimationFrame(render);
  };
  controls.addEventListener('change', invalidate);

  const topFrustum = () => {
    const extent = box.isEmpty() ? new THREE.Vector3(20, 5, 20) : box.getSize(new THREE.Vector3());
    const aspect = perspective.aspect;
    const half = Math.max(extent.z / 2, extent.x / (2 * aspect)) * 1.04;
    orthographic.left = -half * aspect;
    orthographic.right = half * aspect;
    orthographic.top = half;
    orthographic.bottom = -half;
    orthographic.updateProjectionMatrix();
  };
  const resize = () => {
    const rect = stage.getBoundingClientRect();
    size.set(Math.max(1, rect.width), Math.max(1, rect.height));
    renderer.setSize(size.x, size.y, false);
    perspective.aspect = size.x / size.y;
    perspective.updateProjectionMatrix();
    topFrustum();
    invalidate();
  };

  const setView = (next) => {
    if (!VIEWS.some(([key]) => key === next)) return;
    const center = box.isEmpty() ? new THREE.Vector3() : box.getCenter(new THREE.Vector3());
    const extent = box.isEmpty() ? new THREE.Vector3(20, 5, 20) : box.getSize(new THREE.Vector3());
    const damping = controls.enableDamping;
    controls.enableDamping = false;
    controls.update();
    view = next;
    camera = next === 'top' ? orthographic : perspective;
    controls.object = camera;
    controls.enableRotate = next !== 'top';
    if (next === 'top') {
      topFrustum();
      orthographic.zoom = 1;
      orthographic.updateProjectionMatrix();
      camera.position.set(center.x, Math.max(extent.y, 8) + 40, center.z + 0.01);
      controls.target.set(center.x, 0, center.z);
    } else if (next === 'inside') {
      camera.fov = 64;
      camera.updateProjectionMatrix();
      camera.position.set(center.x, 1.65, center.z + Math.max(1.5, extent.z / 2 - 0.6));
      controls.target.set(center.x, 1.5, center.z - 2);
    } else {
      camera.fov = 43;
      camera.updateProjectionMatrix();
      const radius = Math.max(2, extent.length() / 2);
      const distance = (radius / Math.sin(((perspective.fov / 2) * Math.PI) / 180)) * 0.86;
      controls.target.set(center.x, Math.max(0.8, extent.y * 0.3), center.z);
      camera.position.copy(controls.target).addScaledVector(new THREE.Vector3(0.72, 0.6, 1).normalize(), distance);
    }
    controls.update();
    controls.enableDamping = damping;
    for (const button of scene.viewButtons) button.setAttribute('aria-pressed', String(button.dataset.view === view));
    invalidate();
  };

  // Clicking a zone flies the camera onto that area: the label pill lands on the
  // zone anchor and the view stays there until 复位 / another view is picked.
  const stepTween = () => {
    if (!tween) return false;
    const progress = Math.min(1, (performance.now() - tween.start) / tween.duration);
    const eased = progress < 0.5 ? 2 * progress * progress : 1 - 2 * (1 - progress) * (1 - progress);
    controls.target.lerpVectors(tween.fromTarget, tween.toTarget, eased);
    camera.position.lerpVectors(tween.fromPosition, tween.toPosition, eased);
    if (camera === orthographic) {
      orthographic.zoom = tween.fromZoom + (tween.toZoom - tween.fromZoom) * eased;
      orthographic.updateProjectionMatrix();
    }
    if (progress >= 1) tween = null;
    return true;
  };

  const focusZone = (index) => {
    const zone = scene.zones[index];
    if (!zone) return;
    const extent = box.isEmpty() ? new THREE.Vector3(20, 5, 20) : box.getSize(new THREE.Vector3());
    const span = extent.length();
    const target = new THREE.Vector3(...zone.point);
    target.y = Math.max(0.6, target.y * 0.5);
    const distance = THREE.MathUtils.clamp(span * 0.34, 4.5, 15);
    const onwards = camera.position.clone().sub(controls.target);
    const direction = onwards.lengthSq() > 1e-6 ? onwards.normalize() : new THREE.Vector3(0.72, 0.6, 1).normalize();
    if (direction.y < 0.22) direction.setY(0.22).normalize();
    tween = {
      fromTarget: controls.target.clone(),
      toTarget: target,
      fromPosition: camera.position.clone(),
      toPosition: target.clone().addScaledVector(direction, distance),
      fromZoom: orthographic.zoom,
      toZoom: THREE.MathUtils.clamp(span / (distance * 3.2), 1, 6),
      start: performance.now(),
      duration: 640,
    };
    invalidate();
  };

  const selectZone = (index) => {
    active = index;
    scene.zoneButtons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
    if (index == null) {
      scene.selection.hidden = true;
      return;
    }
    const zone = scene.zones[index];
    scene.selectionNo.textContent = `ZONE / ${zone.n}`;
    scene.selectionTitle.textContent = zone.title;
    scene.selectionCopy.textContent = zone.copy;
    scene.selection.hidden = false;
    focusZone(index);
  };

  const lanternMaterials = [];
  const spotLights = [];
  // A scene keeps the atmosphere its own archive page was lit for; a phase may
  // hand it a dimmer variant (散场 / 闭馆 / 傍晚).
  const setMood = (name) => {
    const preset = MOODS[name] || MOODS.light;
    stage.style.background = backdrop(preset.background);
    hemi.color.set(preset.hemi[0]);
    hemi.groundColor.set(preset.hemi[1]);
    hemi.intensity = preset.hemi[2];
    sun.color.set(preset.sun[0]);
    sun.intensity = preset.sun[1];
    fill.color.set(preset.fill[0]);
    fill.intensity = preset.fill[1];
    world.environmentIntensity = preset.env;
    renderer.toneMappingExposure = preset.exposure;
    for (const material of lanternMaterials) material.emissiveIntensity = material.userData.baseEmissive * (preset.lantern ?? 1);
    for (const item of spotLights) item.light.intensity = item.base * (preset.spot ?? 1);
    renderer.shadowMap.needsUpdate = true;
    invalidate();
  };

  const setEnclosure = (on) => {
    if (enclosure) enclosure.visible = on;
    if (scene.roofToggle) scene.roofToggle.checked = on;
    renderer.shadowMap.needsUpdate = true;
    invalidate();
  };
  const setLights = (on) => {
    if (scene.lights) {
      const group = world.getObjectByName(scene.lights);
      if (group) group.visible = on;
    }
    if (scene.lightToggle) scene.lightToggle.checked = on;
    renderer.shadowMap.needsUpdate = true;
    invalidate();
  };
  const setGuests = (count) => {
    const group = peopleGroup || figureGroup;
    if (group) {
      const total = group.children.length;
      const shown = Math.max(0, Math.min(total, Math.round(count)));
      group.children.forEach((child, index) => { child.visible = index < shown; });
    }
    if (scene.guestOutput) scene.guestOutput.textContent = String(count);
    if (scene.guestRange) scene.guestRange.value = String(count);
    renderer.shadowMap.needsUpdate = true;
    invalidate();
  };

  resize();
  setMood(scene.mood);
  new ResizeObserver(resize).observe(stage);
  scene.statusEl.textContent = '读取模型…';
  const gltf = await new GLTFLoader().loadAsync(new URL(scene.glb, import.meta.url).href, (event) => {
    if (!event.lengthComputable) return;
    scene.statusEl.textContent = `读取中 ${Math.round((event.loaded / event.total) * 100)}%`;
  });
  const root = gltf.scene;
  root.updateMatrixWorld(true);
  box.setFromObject(root);
  sun.target.position.copy(box.getCenter(new THREE.Vector3()));
  root.traverse((node) => {
    if (node.isSpotLight) spotLights.push({ light: node, base: node.intensity });
    if (!node.isMesh) return;
    node.castShadow = !(Array.isArray(node.material) ? node.material : [node.material]).some((m) => m && m.transparent);
    node.receiveShadow = true;
    for (const material of Array.isArray(node.material) ? node.material : [node.material]) {
      if (!material || material.name !== 'Lantern warm light') continue;
      material.userData.baseEmissive = material.emissiveIntensity || 1;
      lanternMaterials.push(material);
    }
  });
  world.add(root);

  if (scene.enclosure) {
    enclosure = root.getObjectByName(scene.enclosure);
    if (enclosure) enclosure.visible = scene.roofToggle ? scene.roofToggle.checked : false;
  }
  if (scene.lights) {
    const group = root.getObjectByName(scene.lights);
    if (group) group.visible = scene.lightToggle ? scene.lightToggle.checked : false;
  }
  if (scene.guests) peopleGroup = root.getObjectByName(scene.guests.group);
  if (scene.people) {
    // Borrowed characters: cloned from the shared donor cast onto this scene's spots.
    const cast = await loadDonorCast();
    figureGroup = new THREE.Group();
    figureGroup.name = 'SharedPeople';
    scene.people.spots.forEach(([x, z, rotation = 0, variant = 0], index) => {
      const person = cast[variant % cast.length].clone(true);
      person.name = `Person_${String(index + 1).padStart(2, '0')}`;
      person.position.set(x, 0, z);
      person.rotation.set(0, rotation, 0);
      person.scale.setScalar(DONOR.scale);
      person.traverse((node) => {
        if (!node.isMesh) return;
        node.castShadow = true;
        node.receiveShadow = true;
      });
      figureGroup.add(person);
    });
    world.add(figureGroup);
  }

  scene.zoneButtons = [];
  for (const [index, zone] of scene.zones.entries()) {
    const button = element('button');
    button.type = 'button';
    button.append(element('span', 'zone-no', zone.n), element('b', null, zone.title), element('em', null, '↗'));
    button.setAttribute('aria-pressed', 'false');
    button.addEventListener('click', () => selectZone(active === index ? null : index));
    scene.listEl.appendChild(button);
    scene.zoneButtons.push(button);
    const el = element('span', 'nv-label');
    el.append(element('b', null, zone.n), document.createTextNode(zone.title));
    scene.labelLayer.appendChild(el);
    placed.push({ el, point: new THREE.Vector3(zone.point[0], zone.point[1] + 0.2, zone.point[2]) });
  }

  for (const button of scene.viewButtons) button.addEventListener('click', () => setView(button.dataset.view));
  const reset = stage.querySelector('[data-reset]');
  if (reset) reset.addEventListener('click', () => { tween = null; setView('overview'); selectZone(null); });
  scene.selection.querySelector('.nv-selection-close').addEventListener('click', () => selectZone(null));
  scene.labelToggle.addEventListener('change', () => {
    labelsOn = scene.labelToggle.checked;
    invalidate();
  });
  if (scene.roofToggle) scene.roofToggle.addEventListener('change', () => setEnclosure(scene.roofToggle.checked));
  if (scene.lightToggle) scene.lightToggle.addEventListener('change', () => setLights(scene.lightToggle.checked));
  if (scene.guestRange) scene.guestRange.addEventListener('input', () => setGuests(Number(scene.guestRange.value)));

  resize();
  setMood(scene.mood);
  setView('overview');
  renderer.shadowMap.needsUpdate = true;
  invalidate();
  scene.statusEl.textContent = '已载入';

  return { setView, setEnclosure, setLights, setGuests, selectZone, setMood };
};

const viewers = new Map();

const applyPhase = (scene, phase) => {
  const viewer = viewers.get(scene.id);
  if (!viewer) return;
  if (phase.enclosure !== undefined && scene.enclosure) viewer.setEnclosure(phase.enclosure);
  if (phase.lights !== undefined && scene.lights) viewer.setLights(phase.lights);
  if (phase.guests !== undefined && (scene.guests || scene.people)) viewer.setGuests(phase.guests);
  if (phase.mood) viewer.setMood(phase.mood);
  if (phase.view) viewer.setView(phase.view);
};

for (const scene of SCENES) {
  scene.phase = scene.defaultPhase || 0;
  scene.phases.forEach((phase, index) => {
    const button = element('button');
    button.type = 'button';
    button.append(element('b', null, phase.t), element('span', null, phase.label));
    button.setAttribute('aria-pressed', String(index === scene.phase));
    if (index === scene.phase) scene.timeCurrent.textContent = `${phase.t} ${phase.label}`;
    button.addEventListener('click', () => {
      for (const node of scene.stepList.children) node.setAttribute('aria-pressed', String(node === button));
      scene.phase = index;
      scene.timeCurrent.textContent = `${phase.t} ${phase.label}`;
      applyPhase(scene, phase);
    });
    scene.stepList.appendChild(button);
  });
}

const activate = (scene) => {
  if (scene.loading) return;
  scene.loading = true;
  createViewer(scene)
    .then((viewer) => {
      viewers.set(scene.id, viewer);
      applyPhase(scene, scene.phases[scene.phase]);
    })
    .catch((error) => {
      scene.statusEl.textContent = `模型读取失败：${error.message}`;
      console.error(`${scene.id} viewer failed:`, error);
    });
};

const observer = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    observer.unobserve(entry.target);
    const scene = SCENES.find((item) => item.block === entry.target);
    if (scene) activate(scene);
  }
}, { rootMargin: '600px 0px' });
for (const scene of SCENES) observer.observe(scene.block);
</script>
</body>
</html>
